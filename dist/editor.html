<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Interstate Editor</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<style type="text/css">
		</style>
		<link rel="stylesheet" href="editor/style/fonts/Inconsolata/stylesheet.css" />
		<link rel="stylesheet" href="editor/style/fonts/SourceSansPro/stylesheet.css" />
		<link rel="stylesheet" href="editor/style/editor_style.css" />
		<link rel="stylesheet" href="editor/style/attachment_styles.css" />
		<link rel="stylesheet" href="vendor/bootstrap-3.1.0/css/bootstrap.css">
		<link rel="stylesheet" href="vendor/bootstrap-3.1.0/css/bootstrap-theme.css">

		<script src="vendor/underscore/underscore.js"></script>
		<script src="vendor/jquery-ui-1.10.4.custom/js/jquery-2.1.1.js"></script>
		<script src="vendor/jquery-ui-1.10.4.custom/js/jquery-ui-1.10.4.custom.js"></script>
		<script src="vendor/raphael/raphael.js"></script>
	<script src="vendor/snap/snap.svg.js"></script>
		<script src="vendor/ace/ace.js"></script>
		<script src="vendor/esprima/esprima.js"></script>
		<script src="vendor/qrcode.min.js"></script>
		<script src="interstate.min.js"></script>
	</head>
	<body>
		<div id="editor"></div>

		<div>
			<script type="text/javascript">
				$(function () {
					$("div#editor").editor({
						server_window: window.opener,
						client_id: new URLSearchParams(window.location.search).get("client_id")
						//client_id: getURLParameter("client_id")
					//	debug_ready: true,
					//	debug_env: true,
					//	command_box: true
					});
				});
				function getURLParameter(name) {
					return decodeURI((RegExp(name + '=' + '(.+?)(&|$)').exec(location.search)||[,''])[1]);
				}
			</script>
		</div>
	</body>
</html>
